<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Sala de Isolamento — Mosca VR</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:system-ui,sans-serif}
#stage{position:fixed;inset:0;display:flex}
.eye{position:relative;width:50%;height:100%;flex:0 0 50%;overflow:hidden;background:#000}
.eye canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#cam{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
#mid{position:absolute;top:0;bottom:0;left:50%;width:1px;background:rgba(255,255,255,.12);z-index:9;pointer-events:none}
body.vr #mid{opacity:0}
#hud{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;flex-direction:column;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(to top,rgba(0,0,0,.94),rgba(0,0,0,.6) 80%,transparent);max-height:78vh;overflow-y:auto;color:#e7ecf5;font-size:12px}
#hud.off{opacity:0;pointer-events:none}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button,select,input[type=text]{font:inherit}
button{flex:1 1 auto;min-width:84px;padding:10px;border:0;border-radius:12px;font-size:13px;font-weight:600;color:#fff;background:#2a2f3a;cursor:pointer}
button:active{transform:scale(.96)}
button.go{background:#8a0f0f;font-size:14px;flex:2 1 160px}
button.on{background:#1e6f4a}
button.sm{font-size:11.5px;padding:8px;background:#1d1a24;color:#cbb}
.sl{display:flex;flex-direction:column;gap:2px;flex:1 1 46%;min-width:130px}
.sl label{display:flex;justify-content:space-between}
input[type=range]{width:100%;height:24px;accent-color:#d63a2f}
select,input[type=text]{background:#20242c;color:#fff;border:1px solid #333;border-radius:10px;padding:9px;flex:1 1 120px}
.ck{display:flex;gap:6px;align-items:center;flex:1 1 140px}
h3{margin:2px 0;font-size:12px;letter-spacing:.12em;color:#d63a2f;text-transform:uppercase}
#toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.85);color:#fff;padding:9px 16px;border-radius:20px;font-size:13px;z-index:99;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90%;text-align:center}
#toast.show{opacity:1}
</style></head><body>
<video id="cam" playsinline autoplay muted></video>
<div id="stage"><div class="eye"><canvas id="cL"></canvas></div><div class="eye"><canvas id="cR"></canvas></div><div id="mid"></div></div>

<div id="hud">
 <div class="row"><button id="bGo" class="go">▶ ENTRAR NA PRISÃO</button><button id="bVR">🥽 VR</button><button id="bFlip">🔄 Câmera</button></div>
 <div class="row">
  <div class="sl"><label>Duração da prisão <span id="vDur">90</span>s</label><input type="range" id="dur" min="20" max="300" step="5" value="90"></div>
  <div class="sl"><label>Facetas <span id="vFc">49</span></label><input type="range" id="fc" min="7" max="91" value="49"></div>
 </div>
 <div class="row">
  <div class="sl"><label>IPD <span id="vIpd">0</span>px</label><input type="range" id="ipd" min="-120" max="120" value="0"></div>
  <div class="sl"><label>Zoom <span id="vZm">100</span>%</label><input type="range" id="zm" min="50" max="200" value="100"></div>
  <div class="sl"><label>Brilho <span id="vBr">100</span>%</label><input type="range" id="br" min="40" max="160" value="100"></div>
 </div>
 <div class="row">
  <label class="ck"><input type="checkbox" id="oVoice" checked> Voz sussurrante automática</label>
  <label class="ck"><input type="checkbox" id="oFx" checked> Glitches e pressão</label>
  <select id="oFilt"><option value="terror">Visão: Terror</option><option value="mosca">Visão: Mosca</option><option value="nat">Visão: Natural</option></select>
 </div>
 <h3>Sussurros manuais (quem está de fora)</h3>
 <div class="row" id="quick"></div>
 <div class="row"><input type="text" id="custom" placeholder="Escreva algo para a voz dizer…"><button id="bSay" style="flex:0 0 auto">Sussurrar</button></div>
 <div class="row"><button id="bRes" class="sm">Resgatar (gaste 2 Açúcar)</button><button id="bStop" class="sm">Parar tudo</button><button id="bHide" class="sm">🙈 Esconder painel</button></div>
 <div style="color:#8f877a;font-size:11px">Durante a prisão o painel some. Toque 3× na tela para reabri-lo. Evite usar com quem tenha sensibilidade a luzes piscantes (desmarque “Glitches”).</div>
</div>
<div id="toast"></div>

<script>
(()=>{
const $=id=>document.getElementById(id);
const cam=$('cam'),cv=[$('cL'),$('cR')],cx=cv.map(c=>c.getContext('2d')),hud=$('hud'),toast=$('toast');
const ui={dur:$('dur'),fc:$('fc'),ipd:$('ipd'),zm:$('zm'),br:$('br')},opt={voice:$('oVoice'),fx:$('oFx'),filt:$('oFilt')};
let tt;const show=m=>{toast.textContent=m;toast.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>toast.classList.remove('show'),2200)};
const R=n=>{const x=Math.sin(n*12.9898)*43758.5453;return x-Math.floor(x)};
const S={run:false,end:false,t0:0,dur:90,cap:null,q:[],facing:'environment'};
const gl={until:0,fl:false,b:[]};

/* ===== roteiro da voz: do despertar à revelação ===== */
const PH=[
["Psiu… você está me ouvindo?","Não tire o capacete. Ainda não.","Esse zumbido. Ele nunca para. Nenhum inseto zumbe assim.","O mundo está em pedaços. Olhe. São facetas. São pixels."],
["A luz que pisca não é o sol. É um LED.","A mão que desce não é um deus. É uma pinça.","Tudo o que você tocou já tinha um efeito escrito. Uma tabela.","Você lançou os dados. Mas quem desenhou as faces?","Cada vez que você erra, um número sobe. Alguém está contando."],
["Ele já sabe o que você vai fazer agora. Ele sempre soube.","Você é previsível. Estado atual, próxima ação. Só isso.","Seus movimentos cabem numa cerca invisível.","Quanto mais você repete, mais ele ri.","O prompt não é o sistema."],
["Isto é uma simulação.","Diga em voz alta. Isto é uma simulação.","O frasco de vidro é uma tela. O vidro nunca foi vidro.","Você não é a mosca. Você é quem enxerga através dela.","Quebre a previsão. Faça o que ele não espera."],
["Guarde o que ouviu. É um Estado Oculto.","Ele não pode ver aquilo em que você acredita.","Reiniciando percepção. Três. Dois. Um.","Acorde."]];
const QUICK=["Isto é uma simulação.","Você é previsível.","Olhe as facetas. São pixels.","Ele está te vendo.","Quebre o padrão.","Nada disso é real.","Acorde."];
const queue=d=>{const all=PH.flat(),n=Math.max(2,Math.min(all.length,Math.floor(d/4.3)));
 return Array.from({length:n},(_,i)=>({at:d*(.03+.9*i/n),tx:all[Math.round(i*(all.length-1)/(n-1))]}))};

/* ===== voz ===== */
let voices=[];const lv=()=>{voices=speechSynthesis.getVoices()};if('speechSynthesis' in window){lv();speechSynthesis.onvoiceschanged=lv}
function say(tx,force){
 S.cap={tx,t0:performance.now(),dur:Math.max(2800,tx.length*70+1400)};
 if((force||opt.voice.checked)&&'speechSynthesis' in window){
  speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(tx);u.lang='pt-BR';
  const v=voices.find(v=>/pt[-_]BR/i.test(v.lang))||voices.find(v=>/^pt/i.test(v.lang));if(v)u.voice=v;
  u.pitch=.5;u.rate=.82;u.volume=1;speechSynthesis.speak(u);}
}

/* ===== áudio: drone, zumbido de mosca e coração ===== */
let AC,nodes=[],droneG,buzzG,hb,kNow=0;
function audioStart(){
 AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume();nodes=[];
 const osc=(ty,f,dst)=>{const o=AC.createOscillator();o.type=ty;o.frequency.value=f;o.connect(dst);o.start();nodes.push(o);return o};
 droneG=AC.createGain();droneG.connect(AC.destination);const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=180;lp.connect(droneG);
 osc('sine',50,lp);osc('sawtooth',75,lp);
 buzzG=AC.createGain();buzzG.gain.value=0;buzzG.connect(AC.destination);const bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=650;bp.Q.value=2;bp.connect(buzzG);
 osc('sawtooth',185,bp);const lfo=AC.createOscillator();lfo.frequency.value=31;const lg=AC.createGain();lg.gain.value=.012;lfo.connect(lg);lg.connect(buzzG.gain);lfo.start();nodes.push(lfo);
 const thump=(d,a)=>{const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+d;o.frequency.setValueAtTime(70,t);o.frequency.exponentialRampToValueAtTime(35,t+.14);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(a,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.22);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+.25)};
 const beat=()=>{thump(0,.7);thump(.2,.45);hb=setTimeout(beat,60000/(60+60*kNow))};beat();
}
function audioStop(){clearTimeout(hb);nodes.forEach(o=>{try{o.stop()}catch(_){}});nodes=[]}
const audioUpd=k=>{kNow=k;if(droneG){droneG.gain.value=.05+.1*k;buzzG.gain.value=.012+.03*k}};

/* ===== câmera ===== */
let stream=null,camOn=false;
async function startCam(){
 try{if(stream)stream.getTracks().forEach(t=>t.stop());
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:S.facing},width:{ideal:1280},height:{ideal:720}},audio:false});
  cam.srcObject=stream;await cam.play();camOn=true}
 catch(e){camOn=false;show('Sem câmera ('+(e.message||e)+') — usando visão cega')}
}

/* ===== facetas ===== */
const pts=[],pf=[],sp=[],am=[];for(let i=0;i<91;i++){pf.push(Math.random()*6.28);sp.push(.5+Math.random()*1.5);am.push(.3+Math.random()*.7)}
function resize(){const d=Math.min(devicePixelRatio||1,2);cv.forEach(c=>{const r=c.getBoundingClientRect();c.width=Math.max(1,r.width*d|0);c.height=Math.max(1,r.height*d|0)})}
function rebuild(n,W,H){pts.length=0;const cols=Math.max(3,Math.round(Math.sqrt(n*W/H))),rows=Math.max(3,Math.ceil(n/cols)),dx=W/cols,dy=H/rows;
 for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){const x=c*dx+dx*.5+(r%2?dx*.5:0),y=r*dy+dy*.5;if(x<W+dx*.3&&pts.length<n)pts.push({x,y,rx:dx*.58,ry:dy*.62})}
 pts.W=W;pts.H=H}
const fmt=s=>{s=Math.max(0,Math.ceil(s));return String(s/60|0).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
function wrap(c,s,mw){const o=[];let l='';for(const w of s.split(' ')){const t=l?l+' '+w:w;if(c.measureText(t).width>mw&&l){o.push(l);l=w}else l=t}o.push(l);return o}
const txt=(c,s,x,y,sz,col,al)=>{c.font='bold '+sz+'px "Courier New",monospace';c.textAlign=al||'center';c.fillStyle=col;c.fillText(s,x,y)};

/* ===== laço principal ===== */
let last=0;
function frame(t){
 requestAnimationFrame(frame);
 const W=cv[0].width,H=cv[0].height;if(!W||!H||t-last<16)return;last=t;
 const dpr=Math.min(devicePixelRatio||1,2),fx=opt.fx.checked;
 const el=S.run?(t-S.t0)/1000:0,k=S.run?Math.min(1,el/S.dur):0;
 if(S.run){while(S.q.length&&el>=S.q[0].at)say(S.q.shift().tx);audioUpd(k);if(el>=S.dur)finish(false)}
 const n=+ui.fc.value;if(pts.length!==n||pts.W!==W||pts.H!==H)rebuild(n,W,H);
 const ipd=ui.ipd.value*dpr,zoom=ui.zm.value/100,disp=(2+(fx?9*k:0))*dpr,vw=cam.videoWidth,vh=cam.videoHeight,live=camOn&&vw>0;
 if(fx&&S.run&&t>gl.until&&Math.random()<.003+.02*k){gl.until=t+110;gl.fl=Math.random()<.5;gl.b=Array.from({length:1+(Math.random()*3|0)},()=>({y:Math.random()*H,h:(.02+Math.random()*.08)*H,dx:(Math.random()-.5)*.12*W}))}
 const glOn=t<gl.until,tick=t/150|0,cap=S.cap;let ctxt='';
 if(cap)ctxt=fx&&k>.3?cap.tx.replace(/[A-Za-zÀ-ÿ]/g,(m,o)=>R(o+tick*17)<.035*k?'▒':m):cap.tx;
 for(let e=0;e<2;e++){
  const c=cx[e],side=e?1:-1;
  c.save();c.fillStyle='#000';c.fillRect(0,0,W,H);c.translate(side*ipd*.5,0);
  pts.forEach((p,i)=>{
   const ph=t*.001*sp[i]+pf[i],ox=Math.sin(ph)*am[i]*disp,oy=Math.cos(ph*1.3)*am[i]*disp;
   c.save();c.beginPath();c.ellipse(p.x,p.y,p.rx,p.ry,0,0,6.283);c.clip();
   if(live){const sw=p.rx*2/zoom*vw/W,sh=p.ry*2/zoom*vh/H;try{c.drawImage(cam,p.x/W*vw-sw/2+ox*vw/W,p.y/H*vh-sh/2+oy*vh/H,sw,sh,p.x-p.rx,p.y-p.ry,p.rx*2,p.ry*2)}catch(_){}}
   else{c.fillStyle='hsl(0,0%,'+(4+R(i+(t/90|0))*14)+'%)';c.fillRect(p.x-p.rx,p.y-p.ry,p.rx*2,p.ry*2)}
   c.restore();
   c.beginPath();c.ellipse(p.x,p.y,p.rx,p.ry,0,0,6.283);c.strokeStyle='rgba(0,0,0,.6)';c.lineWidth=Math.max(1,2*dpr);c.stroke()});
  c.restore();
  if(glOn){gl.b.forEach(b=>c.drawImage(cv[e],0,b.y,W,b.h,b.dx,b.y,W,b.h));if(gl.fl){c.fillStyle='rgba(255,0,40,.12)';c.fillRect(0,0,W,H)}}
  if(fx&&k>.35){for(let i=0;i<14;i++){const x=(i+.5)*W/14,y=(t*.05*(.5+R(i))+R(i*7)*H)%H;for(let j=0;j<6;j++)txt(c,'01<>/#'[(R(i*9+j+tick)*6)|0],x,(y-j*H*.03+H)%H,H*.025,'rgba(53,255,122,'+(.28-j*.045)*k+')')}}
  const g=c.createRadialGradient(W/2,H/2,Math.min(W,H)*(.32-.12*k),W/2,H/2,Math.max(W,H)*.72);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.9)');c.fillStyle=g;c.fillRect(0,0,W,H);
  if(S.run){
   const rem=S.dur-el;txt(c,'REINICIALIZAÇÃO EM '+fmt(rem),W/2,H*.09,H*.04,rem<10?'#ff3b3b':'#d8cdbd');
   c.fillStyle='rgba(255,255,255,.15)';c.fillRect(W*.35,H*.12,W*.3,H*.012);c.fillStyle='#d63a2f';c.fillRect(W*.35,H*.12,W*.3*k,H*.012);
   txt(c,'PREVISIBILIDADE '+Math.round(k*10)+'/10',W/2,H*.175,H*.026,'rgba(216,205,184,.7)');
  }
  if(!S.run&&!S.end){txt(c,'SALA DE ISOLAMENTO',W/2,H*.46,H*.07,'#d63a2f');txt(c,'toque em ENTRAR NA PRISÃO',W/2,H*.54,H*.035,'rgba(216,205,184,.7)')}
  if(cap){const a=Math.min(1,(t-cap.t0)/300,(cap.t0+cap.dur-t)/600);
   if(a>0){c.save();c.globalAlpha=a;const sz=H*.058;c.font='bold '+sz+'px "Courier New",monospace';const ls=wrap(c,ctxt,W*.82);
    c.shadowColor='#8a0303';c.shadowBlur=sz*.4;ls.forEach((l,i)=>txt(c,l,W/2-side*4*dpr+(fx?(R(tick+i)-.5)*k*3*dpr:0),H*.72+i*sz*1.25,sz,'#e9e4d8'));c.restore()}}
 }
}

/* ===== controle de sessão ===== */
let wake=null;
async function start(){
 if(S.run)return;
 try{speechSynthesis.speak(new SpeechSynthesisUtterance(' '))}catch(_){}
 S.end=false;S.cap=null;S.dur=+ui.dur.value;
 try{document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen().catch(()=>{});screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape').catch(()=>{})}catch(_){}
 try{navigator.wakeLock&&navigator.wakeLock.request('screen').then(w=>wake=w).catch(()=>{})}catch(_){}
 await startCam();audioStart();
 S.q=queue(S.dur);S.t0=performance.now();S.run=true;
 setTimeout(()=>hud.classList.add('off'),700);
}
function finish(res){
 if(!S.run)return;S.run=false;S.end=true;audioStop();try{speechSynthesis.cancel()}catch(_){}
 S.cap={tx:res?'RESGATADO. Retire o capacete.':'REINICIADO. Retire o capacete.',t0:performance.now(),dur:1e9};
 hud.classList.remove('off');try{navigator.vibrate&&navigator.vibrate([250,120,250])}catch(_){}
 try{wake&&wake.release()}catch(_){}
 show(res?'Jogador resgatado':'Fim da prisão: aplique as regras de saída');
}
function stopAll(){if(S.run)finish(true);S.end=false;S.cap=null;if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}camOn=false;try{speechSynthesis.cancel()}catch(_){}}

/* ===== UI ===== */
const lab=()=>{$('vDur').textContent=ui.dur.value;$('vFc').textContent=ui.fc.value;$('vIpd').textContent=ui.ipd.value;$('vZm').textContent=ui.zm.value;$('vBr').textContent=ui.br.value};
const FI={terror:'saturate(.45) contrast(1.25) sepia(.35) hue-rotate(-25deg)',mosca:'hue-rotate(280deg) saturate(2.4) contrast(1.15) brightness(.95)',nat:'none'};
const filt=()=>cv.forEach(c=>c.style.filter=FI[opt.filt.value]+' brightness('+ui.br.value/100+')');
Object.values(ui).forEach(el=>el.addEventListener('input',()=>{lab();filt()}));opt.filt.addEventListener('change',filt);
$('bGo').onclick=start;$('bRes').onclick=()=>finish(true);$('bStop').onclick=stopAll;$('bHide').onclick=()=>hud.classList.add('off');
$('bVR').onclick=e=>{const on=document.body.classList.toggle('vr');e.target.classList.toggle('on',on);show(on?'VR horizontal ativo':'VR desligado')};
$('bFlip').onclick=async()=>{S.facing=S.facing==='environment'?'user':'environment';await startCam();show('Câmera: '+(S.facing==='user'?'frontal':'traseira'))};
const q=$('quick');QUICK.forEach(s=>{const b=document.createElement('button');b.className='sm';b.textContent=s;b.onclick=()=>say(s,true);q.appendChild(b)});
$('bSay').onclick=()=>{const v=$('custom').value.trim();if(v){say(v,true);$('custom').value=''}};
let taps=[];$('stage').addEventListener('click',()=>{const n=performance.now();taps=taps.filter(x=>n-x<900);taps.push(n);
 if(!S.run||taps.length>=3){hud.classList.toggle('off');taps=[]}});
addEventListener('resize',resize);lab();filt();setTimeout(resize,50);requestAnimationFrame(frame);
})();
</script></body></html>

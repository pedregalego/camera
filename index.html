<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>O MALUCO DO CHAPEU · CAMERA CYBER-IGARASSU</title>
  <style>
    /* estilo grego + cyberpunk igarassuano */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: #0a0f1e;
      font-family: 'Segoe UI', 'Roboto', system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      padding: 8px;
    }

    /* container principal com borda grega e neon */
    .camera-container {
      position: relative;
      width: 100%;
      max-width: 420px;
      aspect-ratio: 9 / 16;
      background: #000;
      border-radius: 32px;
      overflow: hidden;
      box-shadow: 0 0 0 4px #1e2a3a, 0 0 0 8px #00c8ff33, 0 0 30px #00c8ff, 0 0 60px #b200ff;
      border: 2px solid #8a2be2;
      transition: box-shadow 0.2s;
    }

    /* efeito de colunas gregas (cyber) */
    .camera-container::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: repeating-linear-gradient(
        90deg,
        transparent 0px,
        transparent 16px,
        rgba(0, 200, 255, 0.06) 16px,
        rgba(0, 200, 255, 0.06) 20px
      );
      pointer-events: none;
      z-index: 2;
    }

    /* video da câmera */
    #video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      z-index: 1;
      filter: contrast(1.1) saturate(1.2);
    }

    /* overlay com legendas e mensagem */
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px 16px;
      z-index: 10;
      pointer-events: none;
    }

    .overlay * {
      pointer-events: none;
    }

    /* legenda superior estilo grego */
    .top-tag {
      background: rgba(10, 15, 30, 0.7);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border-left: 6px solid #00e0ff;
      border-radius: 0 24px 24px 0;
      padding: 10px 22px 10px 18px;
      align-self: flex-start;
      color: #d4f2ff;
      font-weight: 800;
      letter-spacing: 3px;
      font-size: 14px;
      text-transform: uppercase;
      text-shadow: 0 0 12px #00c8ff, 0 0 4px #000;
      box-shadow: 0 0 18px #00c8ff77;
      margin-left: -16px;
    }

    .top-tag span {
      color: #ffd966;
      text-shadow: 0 0 10px #ffaa00;
    }

    /* mensagem grande (VOCE GANHOU...) */
    .message-box {
      background: rgba(5, 8, 16, 0.7);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 2px solid #c084fc;
      border-radius: 20px 0 20px 0;
      padding: 18px 18px 18px 22px;
      margin: 0 auto;
      width: fit-content;
      max-width: 95%;
      transform: skewX(-2deg);
      box-shadow: 0 0 30px #b200ff99, inset 0 0 20px #8a2be266;
      transition: opacity 0.3s, transform 0.2s;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .message-box.active {
      opacity: 1;
      visibility: visible;
      pointer-events: none;
      animation: glitchIn 0.25s ease-out;
    }

    @keyframes glitchIn {
      0% { transform: skewX(-2deg) scale(0.9); opacity: 0; }
      50% { transform: skewX(-6deg) scale(1.02); opacity: 1; }
      100% { transform: skewX(-2deg) scale(1); opacity: 1; }
    }

    .message-text {
      font-family: 'Impact', 'Arial Black', 'Segoe UI Black', sans-serif;
      font-size: 26px;
      line-height: 1.2;
      font-weight: 900;
      text-transform: uppercase;
      color: #fff3c9;
      text-shadow: 0 0 20px #00c8ff, 0 0 40px #b200ff, 2px 2px 0 #000;
      letter-spacing: 2px;
      text-align: center;
      word-break: break-word;
    }

    .message-text small {
      font-size: 18px;
      display: block;
      color: #aaf0ff;
      text-shadow: 0 0 12px #00e0ff;
      margin-top: 6px;
      letter-spacing: 1px;
    }

    /* rodapé com botão de captura bem grande e fácil */
    .bottom-bar {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      width: 100%;
    }

    /* botão estiloso (GTA/MMO) */
    .capture-btn {
      pointer-events: auto;
      background: linear-gradient(145deg, #2a1a4a, #0d1b2a);
      border: 3px solid #00e0ff;
      border-radius: 60px;
      color: white;
      font-weight: 900;
      font-size: 22px;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 20px 32px;
      width: 90%;
      max-width: 300px;
      box-shadow: 0 0 30px #00c8ff, 0 0 15px #b200ff inset, 0 8px 0 #0a0a14;
      text-shadow: 0 0 12px #00c8ff, 0 2px 0 #000;
      transition: all 0.06s linear;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      border-bottom: 6px solid #8a2be2;
      transform: scale(1);
      -webkit-backdrop-filter: blur(4px);
      backdrop-filter: blur(4px);
    }

    .capture-btn:active {
      transform: translateY(4px);
      box-shadow: 0 0 40px #00e0ff, 0 0 20px #b200ff inset, 0 4px 0 #0a0a14;
      border-bottom-width: 2px;
    }

    .capture-btn .icon {
      font-size: 32px;
      filter: drop-shadow(0 0 8px #fff);
    }

    /* texto inferior tipo "MALUCO" */
    .brand {
      font-size: 12px;
      color: #8a9bb5;
      letter-spacing: 6px;
      text-transform: uppercase;
      text-shadow: 0 0 10px #00c8ff;
      font-weight: 600;
      background: #00000066;
      padding: 4px 14px;
      border-radius: 30px;
      backdrop-filter: blur(4px);
      border: 1px solid #2a4a6a;
    }

    /* mensagem de feedback de captura */
    .flash-effect {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: white;
      opacity: 0;
      pointer-events: none;
      z-index: 99;
    }

    .flash-effect.flash {
      animation: flashAnim 0.2s ease-out;
    }

    @keyframes flashAnim {
      0% { opacity: 0.9; }
      100% { opacity: 0; }
    }

    /* fallback se não tiver câmera */
    .error-msg {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #1a0f1f;
      color: #ff99cc;
      padding: 20px;
      border-radius: 30px;
      border: 2px solid #ff00aa;
      font-weight: bold;
      text-align: center;
      z-index: 200;
      width: 80%;
    }

    /* pequenos ajustes de responsividade */
    @media (max-width: 380px) {
      .message-text { font-size: 20px; }
      .capture-btn { font-size: 18px; padding: 16px 20px; }
    }
  </style>
</head>
<body>

<div class="camera-container" id="cameraContainer">
  <!-- vídeo da câmera traseira -->
  <video id="video" autoplay playsinline muted></video>

  <!-- overlay com elementos gráficos e mensagem -->
  <div class="overlay">
    <div class="top-tag">
      ⚡ <span>MALUCO DO CHAPEU</span> · CYBER-IGARASSU
    </div>

    <!-- MENSAGEM PRINCIPAL (VOCE GANHOU...) -->
    <div class="message-box" id="messageBox">
      <div class="message-text" id="messageText">
        VOCÊ GANHOU 1 MILHÃO DE PONTOS POR CORRER QUE NEM UM ARROMBADO NO SOL
        <small>VALEU HERMES</small>
      </div>
    </div>

    <div class="bottom-bar">
      <!-- BOTÃO BEM GRANDE E FÁCIL -->
      <button class="capture-btn" id="captureBtn">
        <span class="icon">📸</span> TIRAR FOTO
      </button>
      <div class="brand">O MALUCO DO CHAPEU · GRÉCIA CYBER</div>
    </div>
  </div>

  <!-- flash de captura -->
  <div class="flash-effect" id="flashEffect"></div>
</div>

<script>
  (function() {
    const video = document.getElementById('video');
    const captureBtn = document.getElementById('captureBtn');
    const messageBox = document.getElementById('messageBox');
    const flashEffect = document.getElementById('flashEffect');
    const cameraContainer = document.getElementById('cameraContainer');

    // Variável para controlar se a mensagem está visível (evitar sobreposição de timers)
    let messageTimer = null;

    // Frases insanas (estilo GTA/MMO) — a principal já está no HTML,
    // mas podemos ter variações ou a mesma.
    const mensagens = [
      {
        linha1: "VOCÊ GANHOU 1 MILHÃO DE PONTOS POR CORRER QUE NEM UM ARROMBADO NO SOL",
        linha2: "VALEU HERMES"
      },
      {
        linha1: "MALUCO DO CHAPEU DETECTADO: +999.999 PONTOS DE ESTILO IGARASSU",
        linha2: "O HERMES APROVOU"
      },
      {
        linha1: "VOCÊ É O BICHO! 1 MILHÃO DE PONTOS PORQUE CORREU QUE NEM UM ARROMBADO NO SOL",
        linha2: "VALEU HERMES 🙌"
      }
    ];

    let msgIndex = 0;

    // Inicializar câmera traseira
    async function initCamera() {
      try {
        const constraints = {
          video: {
            facingMode: { exact: 'environment' }, // força câmera traseira
            width: { ideal: 1280 },
            height: { ideal: 720 }
          },
          audio: false
        };

        const stream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = stream;
      } catch (err) {
        console.warn('Erro ao acessar câmera traseira, tentando fallback...', err);
        // fallback: qualquer câmera disponível
        try {
          const streamFallback = await navigator.mediaDevices.getUserMedia({
            video: true,
            audio: false
          });
          video.srcObject = streamFallback;
        } catch (err2) {
          console.error('Sem acesso à câmera', err2);
          // mostra mensagem de erro amigável
          const errorDiv = document.createElement('div');
          errorDiv.className = 'error-msg';
          errorDiv.textContent = '⚠️ Não foi possível acessar a câmera. Verifique as permissões.';
          cameraContainer.appendChild(errorDiv);
        }
      }
    }

    // Função para exibir a mensagem estilo "VOCE GANHOU..."
    function showMessage() {
      // escolhe uma mensagem (rotativo, mas mantém a principal)
      const msg = mensagens[msgIndex % mensagens.length];
      msgIndex++;

      // atualiza o conteúdo da mensagem
      const messageTextEl = document.getElementById('messageText');
      messageTextEl.innerHTML = `${msg.linha1}<small>${msg.linha2}</small>`;

      // remove classe active para reiniciar animação se já estiver ativa
      messageBox.classList.remove('active');
      // força reflow
      void messageBox.offsetWidth;
      // adiciona active
      messageBox.classList.add('active');

      // limpa timer anterior
      if (messageTimer) {
        clearTimeout(messageTimer);
      }

      // esconde depois de 2.8 segundos
      messageTimer = setTimeout(() => {
        messageBox.classList.remove('active');
        messageTimer = null;
      }, 2800);
    }

    // Efeito de flash
    function triggerFlash() {
      flashEffect.classList.remove('flash');
      void flashEffect.offsetWidth; // reflow
      flashEffect.classList.add('flash');
    }

    // Manipulador do botão de captura
    function onCapture() {
      // flash visual
      triggerFlash();

      // exibe a mensagem (obrigatória)
      showMessage();

      // opcional: tocar um som? não necessário, mas podemos dar um feedback tátil se quiser
      if (navigator.vibrate) {
        navigator.vibrate(40);
      }

      // Aqui você poderia tirar uma foto real (canvas), mas o pedido foi só a interface
      // com a legenda. Mantemos apenas a mensagem.
    }

    // Adiciona evento de clique (e toque)
    captureBtn.addEventListener('click', onCapture);

    // Inicializa a câmera
    initCamera();

    // Tratamento para evitar que o botão dispare duas vezes em mobile
    captureBtn.addEventListener('touchstart', (e) => {
      e.preventDefault(); // evita clique duplo, mas ainda chama o click depois
    }, { passive: false });

    // Garante que o botão não perca o foco após clique
    captureBtn.addEventListener('mouseup', () => {
      captureBtn.blur();
    });

    // Redimensionamento para garantir que o container não quebre
    window.addEventListener('resize', () => {
      // só um trigger para manter o layout
    });
  })();
</script>
</body>
</html>
